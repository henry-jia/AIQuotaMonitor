name: 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 这个功能解决什么痛点？（而不是先描述方案）
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想 / Proposal
      description: 你期望的样子（可选）
